[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mltoy"
version = "0.1.0"
description = "Weather AI forecasting experiments using ERA5"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "zarr",
    "netcdf4",
    "torch",
    "matplotlib",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "datasets*",
    "forecasts*",
    "models*",
    "training*",
    "utils*",
]

[project.scripts]
train-cnn = "scripts.train_cnn:main"
train-unet = "scripts.train_unet:main"
predict-t2m = "scripts.predict:main"
evaluate-t2m = "scripts.evaluate:main"
